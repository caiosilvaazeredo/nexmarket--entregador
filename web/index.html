<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo argumento --base-href do `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Aceite corridas, acompanhe suas entregas e veja seus ganhos do dia. App oficial dos entregadores Nexmarket.">

  <!-- Cor da barra do navegador no Android — a mesma verde da marca. -->
  <meta name="theme-color" content="#58CC02">

  <!-- Prévia ao compartilhar o link (WhatsApp, Telegram, redes). Sem isto o
       link aparece "pelado", só com a URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nexmarket">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Nexmarket Entregador">
  <meta property="og:description" content="Aceite corridas, acompanhe entregas e veja seus ganhos do dia.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS: no iPhone é isto que define o nome sob o ícone na tela inicial. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexmarket Entregador">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nexmarket Entregador</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
     * O bundle do Flutter tem alguns megabytes. Sem nada aqui, quem abre o
     * site no 4G encara vários segundos de tela branca — e tela branca lê-se
     * como "site quebrado". Esta splash é HTML/CSS puro, então pinta no
     * primeiro frame, antes de qualquer JavaScript baixar.
     */
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F7F7; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #F7F7F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar {
      width: 140px; height: 4px; border-radius: 2px;
      background: #E5E5E5; overflow: hidden;
    }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #58CC02;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    #splash p { margin: 0; color: #6B6B6B; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #16181C; }
      #splash .bar { background: #2A2D33; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Nexmarket Entregador">
    <div class="bar"></div>
    <p>Carregando…</p>
  </div>

  <script>
    /*
     * Quem chama isto é o Dart, no callback de pós-primeiro-frame (ver
     * lib/services/splash.dart). Só ele sabe quando existe pixel na tela:
     * o `onEntrypointLoaded` do carregador resolve quando o main() do Dart
     * começa, o que ainda é tela branca.
     */
    window.nexSplashDone = function () {
      var splash = document.getElementById('splash');
      if (!splash) return;              // idempotente: já saiu
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 350);
    };

    /*
     * Rede de segurança. Se o app travar antes do primeiro frame — SDK do
     * Firebase bloqueado por firewall/extensão, bundle corrompido — o Dart
     * nunca chama nexSplashDone. Sem este prazo a splash ficaria girando
     * para sempre, sugerindo "quase lá" quando na verdade não vai carregar.
     * Preferimos revelar a tela do app (que traz o próprio aviso de erro).
     */
    setTimeout(window.nexSplashDone, 30000);

    {{flutter_js}}
    {{flutter_build_config}}
    // CanvasKit auto-hospedado (copiado no build) — sem dependência de CDN.
    _flutter.loader.load({
      config: { canvasKitBaseUrl: "canvaskit/" },
    });
  </script>
</body>
</html>
